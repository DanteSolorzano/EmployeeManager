<div class="max-w-[1200px] mx-auto p-[30px]">
    <div class="flex justify-between items-center mb-5">
            <h2 class="text-2xl font-bold text-gray-800">Employee list</h2>        
            <button matButton="filled" (click)="openCreateModal()">
            <mat-icon>add</mat-icon>
            New Employee
            </button>

    </div>

    <mat-form-field appearance="outline" class="w-[500px]">
  <mat-label>Filter</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

<div class="mat-shadow-2">
  <table class="w-full" mat-table [dataSource]="dataSource" matSort>

    <!-- img Column -->
    <ng-container matColumnDef="image">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Photo </th>
      <td mat-cell *matCellDef="let row"> 
        <img [src]="row.imageUrl" class="w-[50px] h-[50px] my-[5px]" >
      </td>
    </ng-container>

    <!-- Full Name Column -->
    <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Full Name </th>
    <td mat-cell *matCellDef="let row"> {{row.name}} {{row.lastname1}} {{row.lastname2}} </td>
    </ng-container>

      <!-- email Column -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
      <td mat-cell *matCellDef="let row"> {{row.email}} </td>
    </ng-container>

      <!-- salary Column -->
    <ng-container matColumnDef="salary">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Salary </th>
      <td mat-cell *matCellDef="let row"> {{row.salary | currency}} </td>
    </ng-container>

      <!-- department Column -->
    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Department </th>
      <td mat-cell *matCellDef="let row"> {{row.departmentName}} </td>
    </ng-container>

      <!-- actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Actions </th>
      <td mat-cell *matCellDef="let row"> 
        <button mat-icon-button (click)="openEditModal(row.employeeId)">
            <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="deleteEmployee(row.employeeId)">
            <mat-icon>delete</mat-icon>
        </button>
    </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
    </tr>
  </table>

  <mat-paginator class="border-t border-[#2f2f2f]" [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
</div>


</div>
